<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>treena</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --text: #f0f0f0;
      --sub: #888;
      --accent: #c8ff57;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }

    .wordmark {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      color: var(--accent);
      margin-bottom: 3rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.03em;
      text-align: center;
      max-width: 18ch;
    }

    h1 span {
      color: var(--accent);
    }

    .sub {
      margin-top: 1.5rem;
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      color: var(--sub);
      text-align: center;
      max-width: 42ch;
      line-height: 1.6;
    }

    .cta {
      margin-top: 2.75rem;
      display: inline-block;
      padding: 0.75rem 1.75rem;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: border-color 0.15s, color 0.15s;
    }

    .cta:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="wordmark">treena</div>

  <h1>mobile is the dev machine.<br /><span>no laptop.</span></h1>

  <p class="sub">
    treena puts a full coding environment in your pocket.
    write, run, and ship — entirely from your phone.
  </p>

  <a class="cta" href="#">get early access</a>
</body>
</html>
